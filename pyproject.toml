[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelforge"
version = "0.1.0"
description = "Proof-carrying security detection and remediation for AI-generated API changes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.34,<1",
  "packaging>=24.0,<26",
  "hiddenlayer-sdk>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
sentinelforge = "sentinelforge.cli:main"
sentinelforge-api = "sentinelforge.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelforge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/**/app/*.py" = ["B008"]
