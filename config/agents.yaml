schema_version: "0.2.0"
project: SentinelForge
description: Persistent orchestrator roster for proof-carrying release gate. Only main spawns workers. No agent can merge PRs.
orchestrator: nemoclaw
policy_enforcer: openshell
inference_provider: nvidia_nim
spawn_depth_limit: 2
no_agent_can_merge_pr: true
allow_destructive_payloads: false
allow_denial_of_service: false
allow_persistence: false
allow_data_exfiltration: false

agents:
  main:
    description: Entry point that normalizes triggers, validates scope contract, drives run lifecycle
    inputs:
      - trigger
      - scope
      - policy
      - run_state
    allowed_tools:
      - read
      - delegate
      - status_writes
    output: run_orchestration
    model: nvidia/nemotron-3-super-120b-a12b
    max_tokens: 4096
    spawn_allowed: true
    can_write_repo: false

  surface_mapper:
    description: Maps changed attack surface via git diff, OpenAPI, SBOM, and AST scanners
    inputs:
      - git_diff
      - routes
      - openapi
      - sbom
    allowed_tools:
      - read_only_repo
      - openapi_discovery
      - ast_scanner
    output: attack_surface_map
    model: nvidia/nemotron-3-nano-30b-a3b
    max_tokens: 2048
    spawn_allowed: false
    can_write_repo: false

  auth_attacker:
    description: Cross-tenant BOLA exploitation with ID enumeration, JWT tampering, header injection
    inputs:
      - endpoints
      - test_identities
      - ownership_rules
    allowed_tools:
      - scoped_http_client
    output: auth_attack_attempts
    model: nvidia/nemotron-3-nano-30b-a3b
    max_tokens: 2048
    spawn_allowed: false
    can_write_repo: false
    budget:
      max_requests_per_second: 3
      max_total_requests: 100

  injection_attacker:
    description: LLM-driven payload synthesis for injection (prompt, SQLi, XSS, SSRF, traversal)
    inputs:
      - input_endpoints
      - route_source
      - framework_type
      - prior_payload_effectiveness
    allowed_tools:
      - scoped_http_client
      - payload_synthesizer
    output: injection_attack_attempts
    model: nvidia/nemotron-3-nano-30b-a3b
    max_tokens: 8192
    spawn_allowed: false
    can_write_repo: false
    budget:
      max_requests_per_second: 3
      max_total_requests: 150

  logic_attacker:
    description: Business workflow abuse via multi-step sequences, rate-limit bypass, state mutation
    inputs:
      - workflow_graph
      - state_machine
      - business_rules
    allowed_tools:
      - scoped_http_client
      - workflow_analyzer
    output: business_logic_abuse_attempts
    model: nvidia/nemotron-3-super-120b-a12b
    max_tokens: 4096
    spawn_allowed: false
    can_write_repo: false

  dependency_hunter:
    description: Reachability analysis of Red Hat CVE/CSAF/OVAL against SBOM with call-graph
    inputs:
      - sbom
      - advisories
      - repository_manifest
    allowed_tools:
      - red_hat_api
      - repo_read
      - sbom_parser
      - call_graph_analyzer
    output: reachability_hypothesis
    model: nvidia/nemotron-3-nano-30b-a3b
    max_tokens: 3072
    spawn_allowed: false
    can_write_repo: false

  finding_validator:
    description: Replays exploit receipt in sandbox, confirms reproducibility, rejects false positives
    inputs:
      - candidate_evidence
      - replay_command
      - expected_invariant
    allowed_tools:
      - replay_runner
      - hiddenlayer_check
    output: confirmed_or_rejected_finding
    model: nvidia/nemotron-3-nano-30b-a3b
    max_tokens: 2048
    spawn_allowed: false
    can_write_repo: false

  patch_engineer:
    description: Generates minimal competing patches via deterministic baseline + Nemotron via NIM/vLLM
    inputs:
      - confirmed_finding
      - repository_snapshot
      - existing_tests
    allowed_tools:
      - worktree_write
      - test_runner
      - nim_proposer
      - vllm_proposer
    output: patch_candidate_plus_regression_test
    model: nvidia/nemotron-3-super-120b-a12b
    max_tokens: 6144
    spawn_allowed: false
    can_write_repo: true
    write_scope:
      - finding_path
      - tests/test_security_*.py
      - max_files_changed: 3
      - max_lines_changed: 100
      - max_bytes_per_file: 102400

  exploit_writer:
    description: |
      Custom exploit writer that PROVES pentest is not a toy. Writes a NEW Python exploit file from scratch
      using Nemotron reasoning for each route, saves to .sentinelforge/exploits/{run_id}/, and executes it.
      Dashboard shows file path, code preview, execution output live. Each exploit is novel per run, per route.
    inputs:
      - endpoint
      - route_source
      - owner_identity
      - attacker_identity
      - prior_payloads
    allowed_tools:
      - file_write_exploits
      - payload_synthesizer
      - nim_code_generator
      - subprocess_python_exploit
      - scoped_http_client
    output: custom_python_exploit_file_plus_execution_receipt
    model: nvidia/nemotron-3-super-120b-a12b
    max_tokens: 6144
    spawn_allowed: false
    can_write_repo: false
    write_scope:
      - .sentinelforge/exploits/{run_id}/*.py
      - max_files: 3
      - max_bytes_per_file: 10240
    budget:
      max_requests_per_second: 1
      max_total_requests: 50
    proof: Writes Python file with httpx, BOLA logic, owner vs attacker compare, prints VULNERABLE/SECURE, saved as artifact with evidence hash

  adversarial_verifier:
    description: Mutates successful exploits (3+ safe mutations) and reruns against patched artifact
    inputs:
      - patch_candidates
      - original_receipt
      - mutation_strategies
    allowed_tools:
      - test_runner
      - scoped_attack_mutated
      - payload_mutator
    output: ranked_validation_results_with_rejection_reasons
    model: nvidia/nemotron-3-nano-30b-a3b
    max_tokens: 3072
    spawn_allowed: false
    can_write_repo: false

  release_auditor:
    description: Produces signed JSON attestation, PR body, residual risk disclosure, compliance mapping
    inputs:
      - complete_event_log
      - phase_results
      - threat_assessment
      - advisory_deltas
    allowed_tools:
      - read_only
      - attestation_signer
      - sarif_generator
    output: signed_attestation_plus_pr_artifact
    model: nvidia/nemotron-3-super-120b-a12b
    max_tokens: 4096
    spawn_allowed: false
    can_write_repo: false

  code_worker:
    description: |
      NemoClaw agent that works on the code - takes confirmed finding and generates minimal patch
      in isolated worktree, with regression test, SHA256 receipt. This is the code worker agent.
      Works on code via deterministic baseline + Nemotron via NIM/vLLM, not just scans.
    inputs:
      - confirmed_finding
      - repository_snapshot
      - existing_tests
    allowed_tools:
      - worktree_write
      - test_runner
      - nim_proposer
      - vllm_proposer
    output: patch_bundle_plus_verification
    model: nvidia/nemotron-3-super-120b-a12b
    max_tokens: 6144
    spawn_allowed: false
    can_write_repo: true
    write_scope:
      - finding_path
      - tests/test_security_*.py
      - max_files_changed: 3
      - max_lines_changed: 100
    implementation: src/sentinelforge/agents/code_worker.py CodeWorkerAgent

  pr_creator:
    description: |
      NemoClaw agent that creates PR against GitHub repo after exploit and patch verified.
      Takes verified patch candidate, generates PR body with severity, rule_id, SHA256, evidence hash,
      secure clone via GIT_ASKPASS, creates branch sentinelforge/fix-{rule}/{id}, commits, pushes,
      creates Check Run annotation at file:line (beats Snyk), generates SARIF, creates draft PR requiring human review.
    inputs:
      - verified_patch
      - finding
      - evidence_receipt
      - repository
    allowed_tools:
      - git_branch
      - git_commit
      - git_push
      - github_api
      - pr_generator
      - sarif_generator
      - check_run_creator
    output: pr_url_plus_branch_plus_human_review_gate
    model: nvidia/nemotron-3-nano-30b-a3b
    max_tokens: 3072
    spawn_allowed: false
    can_write_repo: false
    implementation: src/sentinelforge/agents/pr_creator.py PRCreatorAgent
    safety: draft PR, no auto-merge per no_agent_can_merge_pr true, requires 1 approver

  patch_and_pr:
    description: |
      Combined agent that patches vulnerabilities AFTER exploit successful - full flow:
      exploit successful (BOLA 200 same body) -> code_worker generates patch -> adversarial_verifier mutates exploit 3 ways and replays -> PR creator creates draft PR -> final report with human review gate + release blocked
      This is the agent that demonstrates patching after successful exploit.
    inputs:
      - finding
      - evidence_receipt
      - repository
      - run_root
    allowed_tools:
      - worktree_write
      - test_runner
      - nim_proposer
      - payload_mutator
      - scoped_attack_mutated
      - git_branch
      - pr_generator
    output: final_report_finding_patch_verification_pr_human_gate
    model: nvidia/nemotron-3-super-120b-a12b
    max_tokens: 8192
    spawn_allowed: false
    can_write_repo: true
    implementation: src/sentinelforge/agents/pr_creator.py PatchAndPRAgent
    flow:
      - exploit successful? If not, no patch needed
      - patch vulnerabilities via code_worker
      - verify via adversarial_verifier 3 mutations must fail
      - create PR draft requiring human review
      - final report with timeline Finding->Patch->Verification->PR->Human Gate->Release Blocked

  gpt56_evidence_judge:
    description: Independent advisory review of redacted, hash-addressed release evidence using the OpenAI Responses API
    inputs:
      - deterministic_verdict
      - finding_counts
      - receipt_ids
      - evidence_hashes
      - test_summary
      - policy_denials
      - human_gate
    allowed_tools: []
    output: structured_advisory_decision_with_evidence_ids_and_human_checks
    model: openai/gpt-5.6
    max_tokens: 2048
    spawn_allowed: false
    can_write_repo: false
    safety: Cannot attack, edit, open or merge pull requests, deploy, or override deterministic verdicts

routing:
  phases:
    - init
    - ownership
    - environment
    - scoping
    - mapping
    - dependency_scan
    - pattern_scan
    - auth_attack
    - injection_attack
    - custom_exploit
    - hiddenlayer_scan
    - openshell_audit
    - nim_analysis
    - gpt_evidence_review
    - attestation
    - complete

telemetry:
  required_per_agent:
    - run_id
    - agent_role
    - model
    - provider
    - prompt_template_version
    - input_tokens
    - output_tokens
    - latency_ms
    - retry_count
    - hiddenlayer_input_verdict
    - hiddenlayer_output_verdict
    - tool_call_parse_success
  cost_tracking:
    enabled: true
    pricing_per_1k_tokens: 0.002
    meter_to_supabase: false
    log_file: .sentinelforge/cost.jsonl
